# save as: nginx-complete.conf

events {
    worker_connections 1024;
}

http {
    upstream fiftyone {
        server fiftyone:5151;
    }
    
    upstream streamlit {
        server streamlit-training:8501;
    }
    
    upstream tensorboard {
        server tensorboard:6006;
    }
    
    upstream optuna {
        server optuna-dashboard:8080;
    }
    
    server {
        listen 80;
        server_name _;
        
        client_max_body_size 100M;
        
        # FiftyOne annotation interface
        location /annotate/ {
            proxy_pass http://fiftyone/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
        
        # Streamlit training interface
        location /train/ {
            proxy_pass http://streamlit/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
        
        # TensorBoard monitoring
        location /tensorboard/ {
            proxy_pass http://tensorboard/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Optuna dashboard
        location /automl/ {
            proxy_pass http://optuna/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Default to Streamlit
        location / {
            proxy_pass http://streamlit/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}